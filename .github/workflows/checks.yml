# 第三方环境交叉验证 —— ★ 先读这段：它**证明什么**、**不证明什么**
#
# 证明 ✓：换一台机器 / 换一套系统之后，本仓那三套照样全过 ✓ ——
#   ① 组件测试（tests/test_rules.py 等）、② **打包静态检查**（`sh -n` 两个 shell 脚本、
#   `node --check` LuCI 视图、JSON 可解析、Makefile recipe 必须 TAB、`$(CURDIR)/…` 引用的文件
#   必须存在、安装路径与 daemon 的 import 期望一致）、③ daemon 端到端（假 AP + 假 Server）✓。
#   —— 口径只有一份 ✓：三栏跑的是**同一份** `python run_checks.py` ✓。
#
# ★ 本仓最该被 CI 抓的，是 **Windows 与 POSIX 的差异**（AGENTS §5 记的那几条，都只在一台机器上被验过 ✗）：
#   · `subprocess` 输出默认按 GBK/936 解码 ✗ ⇒ 读线程 `UnicodeDecodeError`、`stderr` 变 `None`
#     （连带断言消息自己炸 ✗）；
#   · `shutil.which("sh")` 会找到 **WSL 的 bash.exe** ✗（它看不到 `F:/…` 路径 ⇒ 假失败）；
#   · `create_and_run_task` 的命令 JSON 会**吃掉 ASCII 双引号** ✗。
#   ⇒ 本仓的静态检查"缺 `sh`/`node` 时**明确跳过**" ✓ —— CI 里三栏都带这两样 ✓
#     （Windows 走 Git 自带的 `sh.exe` ✓）⇒ 这三项**应当真的跑到了** ✓：跑没跑看日志 ✓
#     （"跳过"是会明说的 ✓，不许默默当通过 ✗）。
#
# 不证明 ✗（两条，尤其第一条别读错）：
#   ① **不是真机、也不是 OpenWrt** ✗ —— 本仓 AGENTS §0 明确"**不碰真机**"（阶段 B）⇒
#      这里的绿**不许**读成"在 OpenWrt 上验证过" ✗：SDK 构建、LuCI 真渲染、网口传输、
#      AT 配无线**都不在** ✓；端到端那套走的是 `tests/fake_air.py` 的**假 AP + 假 Server** ✓。
#   ② **没有 OpenWrt rootfs** ✗ —— init 脚本 / UCI 默认文件 / `Makefile` 的安装路径只是
#      **静态**核对 ✓（文本级 ✓），没有真的 `opkg install` 跑一遍 ✓。
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false            # 一个系统红，别的照样跑完 ✓
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows（★ 本仓最值钱的一栏：AGENTS §5 那些 Windows 专属坑 ✓）
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 记下这台机器的版本（日志留痕；`sh` / `node` 在不在也一并记 ✓）
        shell: pwsh
        run: |
          Write-Host "OS     : $($env:RUNNER_OS) $($env:ImageOS)"
          Write-Host "python : $(python --version 2>&1)"
          Write-Host "node   : $(node --version 2>&1)"
          $sh = @("C:\Program Files\Git\bin\sh.exe", "/bin/sh") | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "sh     : $sh"

      - name: 一键闸门（三套件；口径 = 退出码 0 且输出无 FAIL/Traceback）
        run: python run_checks.py

      - name: 把报告捞出来（失败时也留档；三栏各一份）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks_report-${{ matrix.os }}
          path: checks_report.md
          if-no-files-found: warn
